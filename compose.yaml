services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smartfactory-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mqtt/passwords.txt:/mosquitto/config/passwords.txt:ro
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: smartfactory-influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: smartfactory-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - influxdb
    restart: unless-stopped

  receptor:
    build: ./backend
    container_name: smartfactory-receptor
    env_file:
      - .env
    environment:
      MQTT_HOST: mosquitto
      INFLUXDB_URL: http://influxdb:8086
      PYTHONUNBUFFERED: "1"
    depends_on:
      - mosquitto
      - influxdb
    restart: unless-stopped

  simulador:
    build: ./maquinas_sim
    container_name: smartfactory-simulador
    env_file:
      - .env
    environment:
      MQTT_HOST: mosquitto
      PYTHONUNBUFFERED: "1"
    depends_on:
      - mosquitto
    restart: unless-stopped

volumes:
  influxdb_data:
  influxdb_config:
  grafana_data: